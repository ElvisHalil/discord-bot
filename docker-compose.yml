services:
  ollama:
    image: ollama/ollama:latest
    container_name: discord-bot-ollama
    restart: unless-stopped
    networks:
      - bot_internal
    volumes:
      # Isolated Docker-managed named volume for LLM weights (zero host path mounts)
      - ollama_models:/root/.ollama
    # Pass host NVIDIA GPU into the Ollama container (Docker Desktop WSL2 / NVIDIA Container Toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-bot
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - bot_internal

    # Inject environment variables at runtime without mounting .env into the container
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_AUTO_PULL=${OLLAMA_AUTO_PULL:-true}

    # =========================================================================
    # STRICT SANDBOX & HOST FILESYSTEM ISOLATION
    # =========================================================================
    # 1. Run as unprivileged user (botuser, UID 1000 : GID 1000)
    user: "1000:1000"

    # 2. Mount the entire root filesystem (/, /usr, /bin, /etc, /app) READ-ONLY
    read_only: true

    # 3. Block all privilege escalation (setuid/sudo/su binaries cannot gain root)
    security_opt:
      - no-new-privileges:true

    # 4. Drop all Linux kernel capabilities (no mount, raw sockets, net_admin, ptrace, etc.)
    cap_drop:
      - ALL

    # 5. Zero host bind-mounts: ONLY isolated Docker-managed named volumes and RAM tmpfs
    #    The Windows/Linux host filesystem is 100% unreachable from inside the container.
    volumes:
      - bot_data:/app/data
      - bot_workspace:/home/botuser/workspace
    tmpfs:
      - /tmp:size=256m,mode=1777

    # 6. Resource & process limits (protects host against runaway commands or fork bombs)
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0

networks:
  bot_internal:
    driver: bridge

volumes:
  ollama_models:
  bot_data:
  bot_workspace:
